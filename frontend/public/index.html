<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0a0a0a" />
        <!--
          Content Security Policy (Final Security Hardening).
          Enforced (not report-only). frame-ancestors is enforced by the
          backend security-headers middleware + X-Frame-Options: DENY on
          API responses; storefront HTML relies on X-Frame-Options from
          the static-hosting layer. Nonce-based script-src tightening is a
          documented P3 follow-up (see backend/server.py:SecurityHeadersMiddleware).
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' https: blob:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https: wss:; script-src 'self' 'unsafe-inline' https://assets.emergent.sh https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://js.stripe.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src https://js.stripe.com https://hooks.stripe.com; form-action 'self'; upgrade-insecure-requests" />
        <meta name="description" content="PHILEON — bespoke fine jewelry, architectural statement rings, editorial pendants and Inspiration Vault releases." />
        <meta name="robots" content="index,follow" />
        <link rel="canonical" href="https://phileon.com/" />
        <meta property="og:site_name" content="PHILEON" />
        <meta property="og:title" content="PHILEON | Bespoke Fine Jewelry" />
        <meta property="og:description" content="Architectural fine jewelry — statement rings, pendants and editorial releases from the PHILEON atelier." />
        <meta property="og:image" content="https://phileon.com/logo.png" />
        <meta property="og:url" content="https://phileon.com/" />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="PHILEON | Bespoke Fine Jewelry" />
        <meta name="twitter:description" content="Architectural fine jewelry — statement rings, pendants and editorial releases from the PHILEON atelier." />
        <meta name="twitter:image" content="https://phileon.com/logo.png" />
        <link rel="icon" type="image/png" href="/logo.png" />
        <link rel="apple-touch-icon" href="/logo.png" />
        <title>PHILEON | Bespoke Fine Jewelry</title>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
        <script>
            if (window.self !== window.top) {
                var debugMonitorScript = document.createElement('script');
                debugMonitorScript.src = 'https://assets.emergent.sh/scripts/debug-monitor.js';
                document.head.appendChild(debugMonitorScript);
                window.tailwind = window.tailwind || {};
                tailwind.config = {
                    corePlugins: { preflight: false },
                };
                var tailwindScript = document.createElement('script');
                tailwindScript.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(tailwindScript);
            }
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
