<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1206" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d4af37" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <mask id="fade">
      <radialGradient id="fadeRad" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="white" stop-opacity="1"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </radialGradient>
      <rect width="800" height="800" fill="url(#fadeRad)"/>
    </mask>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g mask="url(#fade)"><rect width="800" height="800" fill="url(#grid)"/></g>
  <text x="400" y="290" text-anchor="middle" font-family="Cinzel, serif" font-size="22" letter-spacing="9" fill="#8a7027">THE COLLECTIVE</text>
  <text x="400" y="420" text-anchor="middle" font-family="Playfair Display, serif" font-size="110" letter-spacing="6" fill="#f0d98c" font-weight="400">BOSS</text>
  <text x="400" y="530" text-anchor="middle" font-family="Playfair Display, serif" font-size="110" letter-spacing="6" fill="#f0d98c" font-weight="400">KNOT</text>
  <line x1="320" y1="580" x2="480" y2="580" stroke="#d4af37" stroke-opacity="0.35" stroke-width="1"/>
  <text x="400" y="620" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="20" fill="#8a8378">imagery coming soon</text>
</svg>
